# Advanced architecture (Core Req. #4c): CNN-LSTM hybrid w/ attention pooling.
# Also the base config for the hyperparameter (LR), data-strategy (augment) and
# modality-ablation studies below (same protocol, one axis varied at a time).
run_name: cnn_lstm
model: cnn_lstm
model_params:
  cnn_channels: [32, 64]
  lstm_hidden: 64
  dropout: 0.3
modality: all
augment: true
lr: 0.001
weight_decay: 0.0001
batch_size: 64
epochs: 60
early_stop_patience: 10
num_workers: 2
