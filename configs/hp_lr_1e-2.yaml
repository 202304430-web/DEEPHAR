# Hyperparameter study (Core Req. #7), axis = learning rate. Identical to cnn_lstm.yaml otherwise.
run_name: cnn_lstm_lr1e-2
model: cnn_lstm
model_params: {cnn_channels: [32, 64], lstm_hidden: 64, dropout: 0.3}
modality: all
augment: true
lr: 0.01
weight_decay: 0.0001
batch_size: 64
epochs: 60
early_stop_patience: 10
num_workers: 2
