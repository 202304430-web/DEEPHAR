# Hyperparameter study (Core Req. #7), axis = learning rate. This is the cnn_lstm.yaml default lr, duplicated
# under the sweep's naming convention so all 3 LR points share one results prefix (cnn_lstm_lr*).
run_name: cnn_lstm_lr1e-3
model: cnn_lstm
model_params: {cnn_channels: [32, 64], lstm_hidden: 64, dropout: 0.3}
modality: all
augment: true
lr: 0.001
weight_decay: 0.0001
batch_size: 64
epochs: 60
early_stop_patience: 10
num_workers: 2
