# Ablation study (Core Req. #8): remove a sensor modality (gyroscope, 9ch -> 6ch, accel-only).
# Paired with cnn_lstm.yaml (modality: all) — same protocol/seeds/budget, one component removed.
run_name: cnn_lstm_ablation_no_gyro
model: cnn_lstm
model_params: {cnn_channels: [32, 64], lstm_hidden: 64, dropout: 0.3}
modality: accel_only
augment: true
lr: 0.001
weight_decay: 0.0001
batch_size: 64
epochs: 60
early_stop_patience: 10
num_workers: 2
